name: CI

on:
  # No `branches: [ master ]` push trigger: PRs run the checks before merge, nightly/release catch the rest.
  push:
    tags: [ "v*.*.*" ]
  pull_request:
  schedule:
    # Off-peak minute: GitHub Actions schedules cluster at round minutes.
    - cron: "37 3 * * *"
  workflow_dispatch:

# Read-only by default; only the publishing jobs get write access.
permissions:
  contents: read

jobs:
  check-nightly-needed:
    # Always runs: if skipped by its own `if:`, every job `needs`-ing it would be skipped too.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check whether master has new commits since the last nightly attempt
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against nightly-attempted (moved before building), not nightly (moved on success): a
          # failure is tried once, then left alone until master moves.
          attempted_sha="$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly-attempted" --jq .object.sha 2>/dev/null || true)"
          if [ "$attempted_sha" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  smoke-test:
    if: |
      github.event_name != 'schedule' || needs.check-nightly-needed.outputs.changed == 'true'
    needs: [ check-nightly-needed ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 is bl_info's minimum (legacy Action.fcurves API); 5.2 the latest (slotted actions only).
        blender-version: ["4.1", "5.2"]
    container:
      image: blenderkit/headless-blender:blender-${{ matrix.blender-version }}-stable
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite in headless Blender
        run: /home/headless/blender/blender --background --python-exit-code 1 --python tests/run_tests.py

  pep8:
    if: |
      github.event_name != 'schedule' || needs.check-nightly-needed.outputs.changed == 'true'
    needs: [ check-nightly-needed ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pycodestyle
      - run: make pep8

  nightly:
    if: |
      (github.event_name == 'schedule' && needs.check-nightly-needed.outputs.changed == 'true') ||
      github.event_name == 'workflow_dispatch'
    needs: [ smoke-test, pep8, check-nightly-needed ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the nightly tags, publishes the prerelease
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Mark this commit as attempted
        # First step, before anything that could fail (see check-nightly-needed).
        run: |
          git tag -f nightly-attempted
          git push --force origin nightly-attempted
      - name: Package plugin
        run: make build/Blender_JA_SWTOR_Tools.zip
      - name: Extract latest commit message
        id: notes
        run: |
          {
            echo "body<<NIGHTLY_NOTES_EOF"
            git log -1 --format=%B
            echo "NIGHTLY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        # move the nightly tag so the right source code is attached to the release
      - name: Update nightly tag
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: "tags/nightly", sha: context.sha, force: true
              })
            } catch (e) {
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: "refs/tags/nightly", sha: context.sha
              })
            }
      - name: Release nightly
        uses: softprops/action-gh-release@v2
        with:
          name: nightly
          tag_name: nightly
          prerelease: true
          body: |
            Automatic pre-release build.

            Latest change:

            ${{ steps.notes.outputs.body }}

            Install Blender_JA_SWTOR_Tools.zip with the "Install from Disk" button in Blender's add-on preferences.
          files: |
            build/Blender_JA_SWTOR_Tools.zip

  release:
    # Only for vX.Y.Z tag pushes, once smoke-test/pep8 passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ smoke-test, pep8 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the release
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        # .claude/skills/release/tag_release.sh runs this same check before creating the tag.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Package plugin
        run: make build/Blender_JA_SWTOR_Tools.zip

      - name: Extract release notes from tagged commit
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log -1 --format=%B "$GITHUB_SHA"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.notes.outputs.body }}

            Install Blender_JA_SWTOR_Tools.zip with the "Install from Disk" button in Blender's add-on preferences.
          files: |
            build/Blender_JA_SWTOR_Tools.zip
